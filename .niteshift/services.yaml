services:
  # One Compose stack: postgres, valkey, rabbitmq, minio, the Django API and
  # its celery workers, plus the Caddy proxy that fronts every app on port
  # 4000. Compose supervises the containers; ns supervises Compose.
  - name: stack
    command: docker compose -f docker-compose-local.yml -f .niteshift/files/docker-compose.niteshift.yml up
    port: 4000
    stopGracePeriod: 90s

  # Vite/turbo dev servers: web 3000, admin 3001, spaces 3002, live 3100.
  # They are reached through the proxy above, not directly.
  - name: apps
    command: pnpm dev
    stopGracePeriod: 30s
