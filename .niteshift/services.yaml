services:
  # Postgres, Valkey, RabbitMQ, MinIO, the Django API, the celery worker/beat,
  # the migrator, and the Caddy proxy that fronts everything on :4000.
  # docker-compose.niteshift.yml is generated by .niteshift/setup.
  - name: stack
    command: docker compose -f docker-compose-local.yml -f docker-compose.niteshift.yml up
    port: 4000
    stopGracePeriod: 60s

  # turbo dev for the JS workspace: web :3000, admin :3001 (/god-mode),
  # space :3002 (/spaces), live :3100 (/live), plus watch builds for packages.
  - name: apps
    command: pnpm dev
    stopGracePeriod: 30s
